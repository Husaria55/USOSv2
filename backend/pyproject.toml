[project]
name = "usos-zapisy"
version = "0.1.0"
description = "System zapisów na zajęcia (USOSv2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.156.8",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "aiosmtplib==5.1.3",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.uv]
package = false
